
<button id="showFiles" class="btn btn-primary" hidden>Change File</button>
<div class="mb-3 row fileContainer">
  <label for="treads" class="col-sm-4 col-form-label">Trimmed Reads file</label>
  <div class="col-sm-8">
    <input type="file" class="form-control" id="treads" required/>
  </div>
</div>

<!-- Name of the original file containing the trimmed reads -->
<div class="mb-3 row fileContainer">
  <label for="trname" class="col-sm-4 col-form-label">Trimmed Reads filename</label>
  <div class="col-sm-8">
    <input type="text" maxlength="100" class="form-control" id="trname" />
  </div>
</div>

<!-- Number of trimmed reads -->
<div class="mb-3 row">
  <label for="treadsnum" class="col-sm-4 col-form-label">Number of trimmed reads</label>
  <div class="col-sm-8">
    <input type="number" step="1" min="0" class="form-control" id="treadsnum" />
  </div>
</div>

<!-- Number of base pairs in trimmed reads -->
<div class="mb-3 row">
  <label for="treadsbp" class="col-sm-4 col-form-label">
    Number of base pairs in trimmed reads</label>
  <div class="col-sm-8">
    <input type="number" step="0.01" min="0" class="form-control" id="treadsbp" />
  </div>
</div>

<!-- Coverage -->
<div class="mb-3 row">
  <label for="coverage" class="col-sm-4 col-form-label">Coverage</label>
  <div class="col-sm-8">
    <input type="number" step="0.01" min="0" class="form-control" id="coverage" />
  </div>
</div>
