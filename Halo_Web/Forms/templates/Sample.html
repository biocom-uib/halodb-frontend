{% extends "master.html" %}
{% load static%}
    {% block title %}
      HaloFile Experiments Forms 
    {% endblock %}

  {% block content %}
  <header class="d-flex justify-content-between">
    <a href="{% url 'main' %}">
      <img src="{% static 'src/img/icon.png' %}" style="max-width: 10dvw;">
    </a>
    
    <div class="container d-flex justify-content-center align-items-center">
      <h1>HaloFile Insert Section</h1>
    </div>
    <div class="container d-flex align-items-center" style="max-width: 10dvw;">
      <a href="{% url 'profile' %}" class="btn btn-primary">Go to Profile</a>
    </div>
    
  </header>
  <main>
    <form method="POST" id="sampleForm" class="container d-flex justify-content-center" style="width: 80%;">
      {% csrf_token %}
        <div class="accordion w-100 mt-4" id="accordionExample">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                <h2>Sample Generic Information</h2>
              </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <div class="container">
                  <div class="row row-cols-md-2">
                    <div class="col" hidden>
                      <label for="project_id" class="form-label" multiple>Project</label>
                      <select id="project_id" class="form-control"></select>
                    </div>

                    <div class="col">
                      <label for="name" class="form-label">Sample Name(*)</label>
                      <input type="text" name="name" id="name" class="form-control" />
                    </div>
                    
                    <div class="col">
                      <label for="stype" class="form-label">Description</label>
                      <input type="text" class="form-control" id="stype"/>
                    </div>
  
                    <div class="col">
                      <label for="ssize" class="form-label">Sample Size</label>
                      <div class="input-group">
                        <input type="number" name="ssize" id="ssize" class="form-control" step="0.01" min="0.01">
                        <select name="ssizeunit" id="ssizeunit" form="Sample" 
                          class="input-group-text">
                          <option value="ml">ml</option>
                          <option value="l">l</option>
                          <option value="g">g</option>
                          <option value="Kg">Kg</option>
                        </select>
                      </div>           
                    </div>
                    <div class="col">
                      <label for="target_id" class="form-label" multiple>Target nucleic acids</label>
                      <select id="target_id" class="form-control" name="target"></select>
                    </div>
                    <div class="col">
                      <label for="keywords" class="form-label">Aditional Information</label>
                      <input class="form-control" id="keywords"/>
                    </div>    
                  </div>  
                </div>
                
               
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                <h2>Sample Metadata Information</h2>
              </button>
            </h2>
            <div id="collapseTwo" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <div class="row">
                  <!-- Country of origin -->
                  <div class="col">
                    <label for="coun" class="col-form-label">Origin country</label>
                    <input type="text" class="form-control" id="coun" rows="2" maxlength="30" />
                  </div>
                  <!-- Region of origin -->
                  <div class="col">
                    <label for="regi" class="col-form-label">origin region</label>
                    <input type="text" class="form-control" id="regi" rows="2" maxlength="30" />
                  </div>
                  <!-- Geographic location -->
                  <div class="col">
                    <label for="geol" class="col-form-label">Geographic location</label>
                    <input type="text" class="form-control" id="geol" rows="2" maxlength="80" />
                  </div>
                </div>
                
                <div class="row">
                  <!-- Latitude -->
                  <div class="col">
                    <label for="lati" class="col-form-label">Latitude</label>
                    <input type="number" step="any" class="form-control" id="lati" />
                  </div>
                  <!-- Longitude -->
                  <div class="col">
                    <label for="long" class="col-form-label">Longitude</label>
                    <input type="number" step="any" class="form-control" id="long" />
                  </div>
                  <!-- Altitud eover sea level-->
                  <div class="col-4">
                    <label for="alti" class="col-form-label"
                      >Altitude over level at sea(m)</label
                    >
                    <input type="number" step="any" class="form-control" id="alti" />
                  </div>
                  <!-- Depth in meters -->
                  <div class="col-4">
                    <label for="dept" class="col-form-label"
                      >Depth where the sample was taken(m)</label
                    >
                    <input type="number" step="any" class="form-control" id="dept" />
                  </div>
                </div>
                
                <div class="row">
                  <!-- Sampling date -->
                  <div class="col">
                    <label for="dats" class="col-form-label">Sampling date</label>
                    <input type="date" class="form-control" id="dats" />
                  </div>
                  <!-- Hour of collection of the sample -->
                  <div class="col">
                    <label for="hocs" class="col-form-label"
                      >Hour of collection of the sample</label
                    >
                    <input type="time" class="form-control" id="hocs" />
                  </div>
                </div>

                <!-- Other relevant information about the sample -->
                <div class="row">
                  <div class="col">
                    <label for="sour" class="col-form-label"
                      >Other relevant information about the sample</label
                    >
                    <textarea class="form-control" id="sour" rows="3" maxlength="80"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="container d-flex justify-content-end m-3">
        <button id="" type="submit" class="btn btn-primary">
          Create Sample
        </button>
      </form>
  </main>

  {% endblock %}
</html>
