{% extends "master.html" %}
{% load static %} 
{% block title %}
 HaloFile WebApp 
 {% endblock %} 
{% block content %}
<main id="filter" style="height: 85dvh;">
 <!-- Botón para abrir el offcanvas -->
  <div id="textFilterContainer" class="container pt-3 d-flex justify-content-between align-items-center" style="background: none;">
    <!-- Barra de búsqueda centrada -->
    <div class="search-bar px-1 w-100">
      <input type="text" class="form-control" id="searchInput" placeholder="Search by ID or Sample name">
    </div>
    <button class="btn btn-success" type="button">
      Search
    </button>
  </div>

  <!-- Offcanvas izquierdo -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="filtroOffcanvas">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Filtros</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="container">

      </div>
      <div class="accordion" id="filterAccordion">
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingOne">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
              Categoría
            </button>
          </h2>
          <div id="collapseOne" class="accordion-collapse collapse show">
            <div class="accordion-body">
                <div class="d-flex justify-content-between">
                <button type="button" id="aplyFilter" class="btn btn-secondary">
                  Clear Filter
                </button> 
                <button type="button" id="aplyFilter" class="btn btn-success fixed">
                  Apply Filter
                </button>
              </div>
              <div class="row row-cols-md-1">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Resultados -->
  <div id="results" class="container mt-4 mb-5 h-75" style="background: none;">
    <div class="row justify-content-around row-cols-md-4 h-100 g-1">

    </div>
  </div>
  <script>
    const headerDiv=document.querySelector('header').querySelector("div")
    headerDiv.removeChild(headerDiv.firstElementChild)
    const button=document.createElement("button")
    button.className="ms-3 mb-3"
    button.style.background="none"
    button.style.border="none"
    button.style.height="10dvh"
    button.style.width="5dvw"
    button.setAttribute("data-bs-toggle","offcanvas")
    button.setAttribute("data-bs-target","#filtroOffcanvas")
    button.innerHTML=`<p style="font-size:3rem"><i class="bi bi-list" style="color:white;"></i></p>`
    headerDiv.prepend(button)
  </script>
</main>
 {% endblock %}
