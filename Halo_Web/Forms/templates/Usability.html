{% extends "master.html" %}
{% load static%}
{% block title %} 
    HaloFile WebApp 
{% endblock %}
{% block content %}
<main>
  <div class="container form-wrapper">
    <div class="col-md-8">
      <h2 class="text-center mb-4">Formulario de Evaluación de Usabilidad (ISO 9241)</h2>
      <form id="usability-form">

        <!-- Preguntas (eficacia, eficiencia, satisfacción) -->
        <div class="mb-3">
          <label class="form-label">1. ¿Pudiste registrarte sin errores?</label>
          <div class="star-rating">
            <input type="radio" id="q1-5" name="q1" value="5"><label for="q1-5">★</label>
            <input type="radio" id="q1-4" name="q1" value="4"><label for="q1-4">★</label>
            <input type="radio" id="q1-3" name="q1" value="3"><label for="q1-3">★</label>
            <input type="radio" id="q1-2" name="q1" value="2"><label for="q1-2">★</label>
            <input type="radio" id="q1-1" name="q1" value="1"><label for="q1-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">2. ¿El inicio de sesión fue claro y funcional?</label>
          <div class="star-rating">
            <input type="radio" id="q2-5" name="q2" value="5"><label for="q2-5">★</label>
            <input type="radio" id="q2-4" name="q2" value="4"><label for="q2-4">★</label>
            <input type="radio" id="q2-3" name="q2" value="3"><label for="q2-3">★</label>
            <input type="radio" id="q2-2" name="q2" value="2"><label for="q2-2">★</label>
            <input type="radio" id="q2-1" name="q2" value="1"><label for="q2-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">3. ¿Lograste encontrar y consultar los datos que necesitabas?</label>
          <div class="star-rating">
            <input type="radio" id="q3-5" name="q3" value="5"><label for="q3-5">★</label>
            <input type="radio" id="q3-4" name="q3" value="4"><label for="q3-4">★</label>
            <input type="radio" id="q3-3" name="q3" value="3"><label for="q3-3">★</label>
            <input type="radio" id="q3-2" name="q3" value="2"><label for="q3-2">★</label>
            <input type="radio" id="q3-1" name="q3" value="1"><label for="q3-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">4. ¿Cuánto tiempo te tomó completar el registro?</label>
          <div class="star-rating">
            <input type="radio" id="q4-5" name="q4" value="5"><label for="q4-5">★</label>
            <input type="radio" id="q4-4" name="q4" value="4"><label for="q4-4">★</label>
            <input type="radio" id="q4-3" name="q4" value="3"><label for="q4-3">★</label>
            <input type="radio" id="q4-2" name="q4" value="2"><label for="q4-2">★</label>
            <input type="radio" id="q4-1" name="q4" value="1"><label for="q4-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">5. ¿Los formularios eran fáciles y rápidos de llenar?</label>
          <div class="star-rating">
            <input type="radio" id="q5-5" name="q5" value="5"><label for="q5-5">★</label>
            <input type="radio" id="q5-4" name="q5" value="4"><label for="q5-4">★</label>
            <input type="radio" id="q5-3" name="q5" value="3"><label for="q5-3">★</label>
            <input type="radio" id="q5-2" name="q5" value="2"><label for="q5-2">★</label>
            <input type="radio" id="q5-1" name="q5" value="1"><label for="q5-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">6. ¿Los filtros para búsqueda funcionaron de forma intuitiva?</label>
          <div class="star-rating">
            <input type="radio" id="q6-5" name="q6" value="5"><label for="q6-5">★</label>
            <input type="radio" id="q6-4" name="q6" value="4"><label for="q6-4">★</label>
            <input type="radio" id="q6-3" name="q6" value="3"><label for="q6-3">★</label>
            <input type="radio" id="q6-2" name="q6" value="2"><label for="q6-2">★</label>
            <input type="radio" id="q6-1" name="q6" value="1"><label for="q6-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">7. ¿Te sentiste cómodo usando la interfaz?</label>
          <div class="star-rating">
            <input type="radio" id="q7-5" name="q7" value="5"><label for="q7-5">★</label>
            <input type="radio" id="q7-4" name="q7" value="4"><label for="q7-4">★</label>
            <input type="radio" id="q7-3" name="q7" value="3"><label for="q7-3">★</label>
            <input type="radio" id="q7-2" name="q7" value="2"><label for="q7-2">★</label>
            <input type="radio" id="q7-1" name="q7" value="1"><label for="q7-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">8. ¿Consideras agradable el diseño visual de la aplicación?</label>
          <div class="star-rating">
            <input type="radio" id="q8-5" name="q8" value="5"><label for="q8-5">★</label>
            <input type="radio" id="q8-4" name="q8" value="4"><label for="q8-4">★</label>
            <input type="radio" id="q8-3" name="q8" value="3"><label for="q8-3">★</label>
            <input type="radio" id="q8-2" name="q8" value="2"><label for="q8-2">★</label>
            <input type="radio" id="q8-1" name="q8" value="1"><label for="q8-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">9. ¿La navegación entre páginas fue clara y coherente?</label>
          <div class="star-rating">
            <input type="radio" id="q9-5" name="q9" value="5"><label for="q9-5">★</label>
            <input type="radio" id="q9-4" name="q9" value="4"><label for="q9-4">★</label>
            <input type="radio" id="q9-3" name="q9" value="3"><label for="q9-3">★</label>
            <input type="radio" id="q9-2" name="q9" value="2"><label for="q9-2">★</label>
            <input type="radio" id="q9-1" name="q9" value="1"><label for="q9-1">★</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">10. ¿Recomendarías esta aplicación a otra persona?</label>
          <div class="star-rating">
            <input type="radio" id="q10-5" name="q10" value="5"><label for="q10-5">★</label>
            <input type="radio" id="q10-4" name="q10" value="4"><label for="q10-4">★</label>
            <input type="radio" id="q10-3" name="q10" value="3"><label for="q10-3">★</label>
            <input type="radio" id="q10-2" name="q10" value="2"><label for="q10-2">★</label>
            <input type="radio" id="q10-1" name="q10" value="1"><label for="q10-1">★</label>
          </div>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary">Enviar evaluación</button>
        </div>
      </form>

      <div id="resultados" class="mt-4 text-center"></div>
    </div>
  </div>
</main>
{% endblock %}
