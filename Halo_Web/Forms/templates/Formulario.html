{% extends "master.html" %}
{% load static%}
    {% block title %}
      HaloFile Experiments Forms 
    {% endblock %}

  {% block content %}
  <header>
    <a href="{% url 'main' %}">
      <img src="{% static 'src/img/icon.png' %}" width="10%" height="10%" style="min-width: 90px;">
    </a>
    <div class="container mt-4">
      <h1 class="text-center">HaloFile Insert Section</h1>
    </div>
    <a href="{% url 'profile' %}" class="btn btn-primary">Go to Profile</a>
  </header>
  <nav>
    <div class="container mt-4">
      <label for="sourceId">Source:</label>
      <select id="sourceId" name="sampleId" class="form-select">
        <!--Each option is user's samples name-->
      </select>
    </div>
  </nav>
  <main>
    <div id="step-by-step" class="container d-flex justify-content-between mt-4"></div>
    <div
      class="container d-flex flex-column justify-content-center align-items-center mt-4"
    >
      <h2 id="Etapa">Sample</h2>
      <h3 id="komaLabel" data-selected="0">Kind of material:</h3>
    </div>

    <div id="contenedorForm" class="container mt-4">
      <form id="mainForm" class="container">
        <div id="cardForm" class="card p-3">
          <!-- Data Fields-->
        </div>
        <div
          id="containerButtons"
          class="d-flex justify-content-between align-items-center mt-4"
        >
          <button id="goBack" type="button" class="btn btn-secondary" 
                  style="visibility: hidden">
            <i class="bi bi-arrow-left"></i> Go back
          </button>
          <div class="container">
            <button type="button" class="btn btn-primary">
              Save
            </button>
            <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
            <div id="liveToast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="toast-header">

                <strong class="me-auto">Bootstrap</strong>
                <small>11 mins ago</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
              </div>
              <div class="toast-body">
                Hello, world! This is a toast message.
              </div>
            </div>
          </div>
            <button type="submit" id="submit" class="btn btn-primary">
              Next Step <i class="bi bi-arrow-right"></i>
            </button>
          </div>

        </div>
      </form>
    </div>
  </main>

  {% endblock %}
</html>
