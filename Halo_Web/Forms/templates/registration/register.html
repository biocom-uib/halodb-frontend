{% extends "master.html" %}
{% load static %} 
{% block title %} HaloFile WebApp {% endblock %} 
{% block content %}
  <main>
    <section class="d-flex justify-content-center align-items-center">
      <div id="registerFormCard" class="card p-3 m-3">
        <div class="card-body">
          {% if messages %}
          <div class="alert alert-danger mt-3" role="alert">
              {% for message in messages %}
                  <p>{{ message }}</p>
              {% endfor %}
          </div>
          {% endif %}
          <h5 class="card-title d-flex justify-content-center">Register</h5>
          <form id="registerForm" method="POST">
            {% csrf_token %}
            <div class="row p-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" name="name">
            </div>

            <div class="row p-3">
              <label for="surname" class="form-label">Surname</label>
              <input type="text" class="form-control" id="surname" name="surname">
            </div>

            <div class="row p-3">
              <label for="email" class="form-label">Email address *</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>
            
            <div class="row p-3">
              <label for="password" class="form-label">Password *</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="row p-3">
              <input type="submit" class="btn btn-succes" value="Confirm">
            </div>
          </form>
        </div>
      </div> 
    </section>  
</main>
<script src="{% static 'JS/PROFILE/registerPOST.js' %}"></script>
{% endblock %}
