{% extends "master.html" %}
{% load static %} 
{% block title %}
 HaloFile WebApp 
 {% endblock %} 
{% block content %}

  <main id="profile" class="pb-5">
    <section id="userData" class="container d-flex justify-content-center p-3" style="background: none;">
      <form id="userDataForm" class="card" style="width: 87vw;">
        <div class="card-header">
          <h2>User Profile</h2>
        </div>
        <div class="card-body">
          <div id="userData" class="row mb-3 row-cols-md-2">
            <label for="name" class="form-label">
              <strong>Name </strong>
            </label>
            <input id="name" class="form-control" value="{{ user.name }}" type="text" autocomplete="name" readonly>

            <label for="surname" class="form-label">
              <strong>Surname </strong>
            </label>
            <input id="surname" class="form-control" value="{{ user.surname }}" type="text" readonly>

            <label for="email" class="form-label">
              <strong>Email </strong>
            </label>
            <input id="email" class="form-control" value="{{ user.email }}" type="email" readonly>
          </div>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <button id="changeProfile" type="submit" class="btn btn-success" hidden>Save Changes<i class="bi bi-pencil-square"></i></button>
          <button id="editProfile" type="button" class="btn btn-secondary">Edit Profile<i class="bi bi-pencil-square"></i></button>
        </div>
      </form>
    </section>

    <div class="container" style="background: none;">
      <h3 class="text-center"><strong>My Samples</strong></h3>
    </div>
    
    <section id="userProjects" class="pt-1">
      
      <div class="container justify-content-center p-3" style="background: none;">
        <div id="profileSamples" class="row d-flex justify-content-between row-cols-md-6 g-4">
          <div class="col">
            <div class="container d-flex align-items-center justify-content-center" style="background: none;">
              <a href="{% url 'Sample' %} " aria-label="Add new Sample" class="d-flex align-items-center justify-content-center addButon">
                <svg xmlns="http://www.w3.org/2000/svg" width="10rem" height="10rem" fill="currentColor" class="bi bi-plus-circle-dotted" viewBox="0 0 16 16">

                </svg>
              </a>  
            </div>           
          </div>        
        </div>
      </div>
    </section>
    <div class="container" style="background: none;">
      <h3 class="text-center"><strong>My Groups</strong></h3>
    </div>
    <section id="experimentsSection" class="pt-1">
      <div class="container justify-content-center p-3" style="background: none;">
        <div id="groupContainer" class="row d-flex justify-content-between row-cols-md-6 g-4"></div>
      </div>
    </section>

    <div class="container" style="background: none;">
      <h3 class="text-center"><strong>Shared with me</strong></h3>
    </div>

    <section class="pt-1 pb-3">
      <div class="container justify-content-center p-3" style="background: none;">
        <div id="sharedSamples" class="row d-flex justify-content-between row-cols-md-6 g-4">
          <div class="col">
            <div class="container d-flex align-items-center justify-content-center" style="background: none;">  
            </div>           
          </div>        
        </div>
      </div>
    </section>

    <!--Modal-->
    
  </main>
    
{% endblock %}
