services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_halofiles_app
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - FORCE_SCRIPT_NAME=/halofiles
    volumes:
      - logs_volume:/app/logs
      - static_volume:/app/public_html
    networks:
      - halo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: django_halofiles_nginx
    restart: always
    depends_on:
      - web
    ports:
      - "127.0.0.1:10800:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
    networks:
      - halo_network

networks:
  halo_network:
    driver: bridge

volumes:
  logs_volume:
  static_volume:
