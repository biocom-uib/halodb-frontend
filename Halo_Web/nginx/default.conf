map $http_x_forwarded_proto $upstream_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Convenience redirect if someone opens container root.
    location = / {
        return 302 /halofiles/;
    }

    # Static files collected by Django in /app/public_html (mounted as /static here).
    location /halofiles/static/ {
        alias /static/;
        access_log off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # Django app under /halofiles. Strip prefix before proxying to gunicorn.
    location /halofiles/ {
        proxy_pass http://web:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /halofiles;
        proxy_redirect off;
    }
}
